<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>D-Day Calendar</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Pretendard", sans-serif;
    }

    body {
      margin: 0;
      background: linear-gradient(135deg, #f6f8ff, #e9efff);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
      font-size: 28px;
    }

    .calendar-box {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    label {
      font-weight: 600;
      color: #555;
    }

    input[type="date"] {
      padding: 14px;
      border: 2px solid #dbe3ff;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
      transition: 0.2s;
    }

    input[type="date"]:focus {
      border-color: #7a9cff;
    }

    button {
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: #6b8cff;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #5578f6;
    }

    .result {
      margin-top: 25px;
      padding: 20px;
      border-radius: 18px;
      background: #f3f6ff;
      text-align: center;
    }

    .dday {
      font-size: 40px;
      font-weight: bold;
      color: #4c6fff;
      margin-top: 10px;
    }

    .today {
      margin-top: 10px;
      color: #666;
      font-size: 14px;
    }

    .saved {
      margin-top: 18px;
      color: #888;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>📅 D-Day 계산기</h1>

    <div class="calendar-box">
      <label for="dateInput">날짜 선택</label>
      <input type="date" id="dateInput" />

      <button onclick="calculateDday()">D-Day 계산하기</button>
    </div>

    <div class="result" id="result">
      날짜를 선택해주세요 ✨
    </div>

    <div class="saved">
      선택한 날짜는 자동 저장됩니다.
    </div>
  </div>

  <script>
    // 저장된 날짜 불러오기
    window.onload = () => {
      const savedDate = localStorage.getItem("savedDate");

      if (savedDate) {
        document.getElementById("dateInput").value = savedDate;
        calculateDday();
      }
    };

    function calculateDday() {
      const input = document.getElementById("dateInput").value;

      if (!input) {
        alert("날짜를 선택해주세요!");
        return;
      }

      // 날짜 저장
      localStorage.setItem("savedDate", input);

      const selectedDate = new Date(input);
      const today = new Date();

      // 시간 제거
      selectedDate.setHours(0,0,0,0);
      today.setHours(0,0,0,0);

      const diffTime = today - selectedDate;
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

      const result = document.getElementById("result");

      if (diffDays > 0) {
        result.innerHTML = `
          <div>선택한 날짜부터 오늘까지</div>
          <div class="dday">D+${diffDays}</div>
          <div class="today">📌 선택 날짜: ${input}</div>
        `;
      } else if (diffDays === 0) {
        result.innerHTML = `
          <div class="dday">🎉 TODAY 🎉</div>
          <div class="today">오늘입니다!</div>
        `;
      } else {
        result.innerHTML = `
          <div>오늘까지 남은 날짜</div>
          <div class="dday">D${diffDays}</div>
          <div class="today">📌 선택 날짜: ${input}</div>
        `;
      }
    }
  </script>

</body>
</html>
